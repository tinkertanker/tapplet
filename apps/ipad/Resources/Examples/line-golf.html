<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line golf</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2ff;color:#1e2748;font:16px system-ui,sans-serif}main{max-width:920px;margin:auto;padding:16px}h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px}p{margin:0 0 12px;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}.card{background:#fff;border-radius:16px;padding:14px}label{display:block;margin:12px 0;font-weight:700}input[type=range]{width:100%;min-height:44px;accent-color:#3d4ec9}output{font-variant-numeric:tabular-nums}svg{width:100%;height:320px;background:#f7f8ff}button{min-height:44px;margin:6px 6px 0 0;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;background:#3d4ec9;color:#fff}#reset{background:#eceeff;color:#1e2748}#again{display:none;background:#1e2748}#msg{min-height:44px;margin:10px 0 0;line-height:1.4}.bar{display:flex;gap:16px;margin:0 0 8px;font-variant-numeric:tabular-nums}@media(max-width:700px){.grid{grid-template-columns:1fr}svg{height:240px}}
</style></head><body><main><h1>Line golf</h1><p>Move m and c so y = mx + c passes through every flag. Each check is a stroke. Beat par.</p>
<div class="grid"><section class="card"><div class="bar"><span>Hole <strong id="hole">1</strong>/3</span><span>Strokes <strong id="strokes">0</strong></span><span>Par <strong id="par">4</strong></span></div><h2>y = <span id="eq"></span></h2><label>Gradient m: <output id="mv"></output><input id="m" type="range" min="-3" max="3" step=".5" value="1"></label><label>Vertical intercept c: <output id="cv"></output><input id="c" type="range" min="-5" max="5" step="1" value="0"></label><button type="button" id="check">Check the line</button><button type="button" id="reset">Reset this hole</button><button type="button" id="again">Play again</button><p id="msg" aria-live="polite"></p></section><section class="card"><h2>Course</h2><svg viewBox="0 0 500 400" aria-label="Straight line and flag targets"><path d="M25 200H475M250 20V380" stroke="#d5daf4" stroke-width="2"/><path id="plot" stroke="#3d4ec9" stroke-width="6" fill="none"/><g id="flags"></g><text x="455" y="220">x</text><text x="260" y="36">y</text></svg></section></div>
<script>
const holes=[
  {par:4,m:1,c:0,targets:[[1,3],[2,5],[3,7]],hint:"A steep rise through three points in a straight line."},
  {par:4,m:1,c:0,targets:[[-2,4],[0,2],[2,0]],hint:"The line should fall as x increases."},
  {par:3,m:1,c:0,targets:[[1,1],[2,1],[3,1]],hint:"If every flag is at the same height, the gradient is 0."}
];
let h=0,strokes=0,finished=false;
const xMap=x=>250+x*40,yMap=y=>200-y*18;
function onLine(m,c,x,y){return Math.abs(m*x+c-y)<0.01}
function draw(){const m=+mIn.value,c=+cIn.value;mv.value=m;cv.value=c;eq.textContent=`${m}x ${c<0?"−":"+"} ${Math.abs(c)}`;plot.setAttribute("d",`M25 ${200-(m*-5.6+c)*18} L475 ${200-(m*5.6+c)*18}`);const g=document.getElementById("flags");g.innerHTML="";holes[h].targets.forEach(([x,y])=>{const hit=onLine(m,c,x,y);g.insertAdjacentHTML("beforeend",`<circle cx="${xMap(x)}" cy="${yMap(y)}" r="9" fill="${hit?"#2f9d5c":"#d24b3c"}"/><text x="${xMap(x)+10}" y="${yMap(y)-8}" font-size="12">(${x}, ${y})</text>`)})}
function allHit(){const m=+mIn.value,c=+cIn.value;return holes[h].targets.every(([x,y])=>onLine(m,c,x,y))}
function load(){finished=false;const hole=holes[h];mIn.value=hole.m;cIn.value=hole.c;strokes=0;document.getElementById("hole").textContent=h+1;document.getElementById("par").textContent=hole.par;document.getElementById("strokes").textContent=0;document.getElementById("again").style.display="none";msg.textContent=hole.hint;draw()}
const mIn=document.getElementById("m"),cIn=document.getElementById("c");
mIn.oninput=cIn.oninput=draw;
document.getElementById("check").onclick=()=>{if(finished)return;strokes+=1;document.getElementById("strokes").textContent=strokes;if(allHit()){const vs=strokes<=holes[h].par?"on or under par.":"over par, but the line is through every flag.";msg.textContent="All flags hit in "+strokes+" stroke"+(strokes===1?"":"s")+", "+vs;if(h<holes.length-1){h+=1;setTimeout(load,1200)}else{finished=true;msg.textContent+=" Course finished. Play again to restart from hole 1.";document.getElementById("again").style.display="inline-block"}}else{const m=+mIn.value,c=+cIn.value,t=holes[h].targets.find(([x,y])=>!onLine(m,c,x,y));const need=t[1]-(m*t[0]+c);msg.textContent=need>0?"The line is too low for ("+t[0]+", "+t[1]+"). Increase c to slide it up, or change m so it tilts through that flag.":"The line is too high for ("+t[0]+", "+t[1]+"). Decrease c, or change m."}};
document.getElementById("reset").onclick=load;
document.getElementById("again").onclick=()=>{h=0;load()};
load();
</script></body></html>
