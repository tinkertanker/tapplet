<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spell it before the sun sets</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff6e4;color:#3d2a12;font:16px system-ui,sans-serif}main{max-width:640px;margin:auto;padding:18px}h1{font-size:clamp(26px,5.5vw,38px);line-height:1.1;margin:0 0 8px}p{margin:0 0 12px;line-height:1.45}.sun{width:min(280px,70vw);margin:8px auto 16px;display:block}.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;font-size:clamp(22px,6vw,34px);font-weight:700;letter-spacing:.12em}.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}button{min-height:44px;min-width:44px;border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:700;background:#fff;color:#3d2a12;border:2px solid #e7c48a}.keys button:disabled{opacity:.4}#next,#again{display:none;width:100%;margin-top:10px;background:#c45b2c;color:#fff;border-color:#c45b2c}#again{background:#3d2a12;border-color:#3d2a12}#msg{min-height:44px;margin:10px 0 0;line-height:1.4}
</style></head><body><main><h1>Spell it before the sun sets</h1><p id="clue"></p>
<svg class="sun" viewBox="0 0 200 200" aria-hidden="true"><g id="rays" fill="#f0b429"></g><circle cx="100" cy="100" r="46" fill="#ffd24a" stroke="#e09a16" stroke-width="3"/><circle cx="84" cy="92" r="5" fill="#3d2a12"/><circle cx="116" cy="92" r="5" fill="#3d2a12"/><path id="mouth" d="M78 118 Q100 132 122 118" fill="none" stroke="#3d2a12" stroke-width="4" stroke-linecap="round"/></svg>
<p class="letters" id="slots" aria-live="polite"></p>
<div class="keys" id="keys"></div>
<p id="msg" aria-live="polite"></p>
<button type="button" id="next">Next word</button>
<button type="button" id="again">Play again</button>
<script>
const words=[
  {w:"island",clue:"Land with water all around it. Listen for a silent letter.",pattern:"The s in island is silent. You hear I-land.",tricky:"s",why:{z:"No z. The hiss you might expect is a silent s: I-land.",c:"No c. Island is not spelled with a c.",y:"No y. The second vowel sound is covered by silent s: I-land."}},
  {w:"enough",clue:"As much as you need. The last sound is /f/, not a hard g.",pattern:"gh here sounds like f, as in laugh.",tricky:"g",why:{f:"No f. The /f/ sound at the end is spelled gh.",k:"No k. This word does not use k for the last sound.",q:"No q. The last sound is /f/, spelled gh."}},
  {w:"science",clue:"The subject where you test ideas. It does not start with s alone.",pattern:"sc can sound like /s/, as in scene and science.",tricky:"c",why:{k:"No k. The first sound is /s/, spelled sc.",f:"No f. The first sound is /s/, spelled sc.",t:"No t at the start. Science starts with sc."}},
  {w:"receipt",clue:"The slip you get after you pay. One letter is silent.",pattern:"The p in receipt is silent. You hear re-seet.",tricky:"p",why:{s:"No s. Receipt keeps a silent p: re-seet.",f:"No f. The last sound is t, and the p is silent.",k:"No k. This word is receipt, with a silent p."}},
  {w:"friend",clue:"Someone you like and trust. Remember i before e here.",pattern:"This word keeps i before e: friend.",tricky:"i",why:{a:"No a. Friend is i before e, not a.",y:"No y. The vowel in the middle is ie, not y.",o:"No o. Friend is not spelled with o."}},
  {w:"rhythm",clue:"The beat in music. There is no a, e, i, o or u in the middle.",pattern:"y is doing the vowel job in rhythm.",tricky:"y",why:{a:"No a. y is the vowel in rhythm.",e:"No e. y is the vowel in rhythm.",i:"No i. y is the vowel in rhythm.",o:"No o. y is the vowel in rhythm.",u:"No u. y is the vowel in rhythm."}}
];
const MAX=6;let i=0,word="",guessed=new Set(),wrong=0,done=false;
function rays(){const g=document.getElementById("rays");g.innerHTML="";for(let n=0;n<wrong;n++){const a=(n/MAX)*Math.PI*2-Math.PI/2;const line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("x1",String(100+Math.cos(a)*58));line.setAttribute("y1",String(100+Math.sin(a)*58));line.setAttribute("x2",String(100+Math.cos(a)*92));line.setAttribute("y2",String(100+Math.sin(a)*92));line.setAttribute("stroke","#f0b429");line.setAttribute("stroke-width","8");line.setAttribute("stroke-linecap","round");g.appendChild(line)}}
function render(){const item=words[i];word=item.w;document.getElementById("clue").textContent="Clue: "+item.clue;document.getElementById("slots").textContent=[...word].map(ch=>guessed.has(ch)?ch.toUpperCase():"_").join(" ");document.getElementById("mouth").setAttribute("d",wrong>=MAX?"M78 128 Q100 114 122 128":"M78 118 Q100 132 122 118");rays()}
function keys(){const box=document.getElementById("keys");box.innerHTML="";[..."abcdefghijklmnopqrstuvwxyz"].forEach(ch=>{const b=document.createElement("button");b.type="button";b.textContent=ch.toUpperCase();b.dataset.ch=ch;b.setAttribute("aria-pressed","false");b.onclick=()=>tap(ch,b);box.appendChild(b)})}
function missTip(item,ch){return item.why[ch]||("No "+ch.toUpperCase()+" in this word. "+item.pattern)}
function tap(ch,btn){if(done||guessed.has(ch))return;guessed.add(ch);btn.disabled=true;btn.setAttribute("aria-pressed","true");const item=words[i];if(word.includes(ch)){const complete=word.split("").every(c=>guessed.has(c));if(complete){done=true;document.getElementById("next").style.display="block";msg.textContent="That's the word. "+item.pattern}else{msg.textContent=ch===item.tricky?item.pattern:"Yes. Keep going."}}else{wrong+=1;const tip=missTip(item,ch);if(wrong>=MAX){done=true;document.getElementById("next").style.display="block";guessed=new Set([...word]);msg.textContent=tip+" The word was "+word.toUpperCase()+". "+item.pattern}else{msg.textContent=tip+" A ray is added."}}render()}
function next(){if(i>=words.length-1){document.getElementById("next").style.display="none";document.getElementById("again").style.display="block";msg.textContent="Those were the six words. Play again, or swap the list at the top of the page for this week's spelling.";return}i+=1;guessed=new Set();wrong=0;done=false;msg.textContent="";document.getElementById("next").style.display="none";keys();render()}
function start(){i=0;guessed=new Set();wrong=0;done=false;msg.textContent="";document.getElementById("next").style.display="none";document.getElementById("again").style.display="none";keys();render()}
document.getElementById("next").onclick=next;document.getElementById("again").onclick=start;start();
</script></body></html>
