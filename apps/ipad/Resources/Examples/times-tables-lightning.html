<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Times-tables lightning</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:#3a2714;font:16px system-ui,sans-serif}main{max-width:560px;margin:auto;padding:18px}h1{font-size:clamp(26px,6vw,40px);line-height:1.1;margin:0 0 8px}p{margin:0 0 12px;line-height:1.4}.bar{display:flex;justify-content:space-between;gap:10px;margin:0 0 16px;font-variant-numeric:tabular-nums}.bar strong{font-size:22px}#q{font-size:clamp(34px,8vw,52px);font-weight:700;margin:8px 0 16px;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{min-height:52px;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700}#choices button{background:#fff;color:#3a2714;border:2px solid #e2c9a4}#choices button:disabled{opacity:.7}.ok{outline:3px solid #2f7a4a}.bad{outline:3px solid #b33b32}#msg{min-height:48px;margin:14px 0;line-height:1.4}#again,#review,#again-play{background:#b33b32;color:#fff;width:100%;margin-top:8px}#review{background:#3a2714}#again-play{display:none}#end{display:none}#end h2{margin:0 0 8px}#missed{margin:0 0 12px;padding-left:1.2em}#missed:empty{display:none}
</style></head><body><main><h1>Times-tables lightning</h1><p>Answer as many 6, 7, 8 and 9 times-table facts as you can in 60 seconds. A miss breaks the streak and comes back at the end.</p>
<div id="play"><div class="bar"><span>Time <strong id="time">60</strong></span><span>Score <strong id="score">0</strong></span><span>Streak <strong id="streak">0</strong></span></div><p id="q" aria-live="polite"></p><div id="choices" class="choices"></div><p id="msg" aria-live="polite"></p><button type="button" id="again-play">Play again</button></div>
<div id="end"><h2>Time up</h2><p id="summary"></p><p>Missed facts to try again:</p><ul id="missed"></ul><button type="button" id="review">Practise missed facts</button><button type="button" id="again">Play again</button></div>
<script>
const tables=[6,7,8,9];let time=60,score=0,streak=0,best=0,timer=null,current=null,missed=[],busy=false,reviewing=false;
function fact(){const a=tables[Math.floor(Math.random()*tables.length)],b=2+Math.floor(Math.random()*10);return {a,b,n:a*b,text:a+" × "+b}}
function choicesFor(item){const set=new Set([item.n]);[[item.a-1,item.b],[item.a+1,item.b],[item.a,item.b-1],[item.a,item.b+1],[item.a-1,item.b+1],[item.a+1,item.b-1]].forEach(([a,b])=>{if(a>=2&&a<=12&&b>=2&&b<=12&&a*b!==item.n) set.add(a*b)});while(set.size<4){const jitter=item.n+[3,4,6,7,8,9,-3,-4,-6][Math.floor(Math.random()*9)];if(jitter>0&&jitter!==item.n) set.add(jitter)}const distractors=[...set].filter(n=>n!==item.n).slice(0,3);return [item.n,...distractors].sort(()=>Math.random()-0.5)}
function show(item){current=item;q.textContent=item.text+" = ?";msg.textContent="";const box=document.getElementById("choices");box.innerHTML="";choicesFor(item).forEach(n=>{const btn=document.createElement("button");btn.type="button";btn.textContent=n;btn.onclick=()=>pick(n,btn);box.appendChild(btn)})}
function pick(n,btn){if(busy||!current)return;busy=true;document.querySelectorAll("#choices button").forEach(b=>b.disabled=true);const right=n===current.n;btn.className=right?"ok":"bad";if(right){score+=1;streak+=1;if(streak>best)best=streak;msg.textContent=streak>1?"Yes. Streak "+streak+".":"Yes. "+current.a+" × "+current.b+" = "+current.n+"."}else{streak=0;missed.push(current);msg.textContent="Not "+n+". "+current.a+" × "+current.b+" = "+current.n+", so "+current.n+" ÷ "+current.a+" = "+current.b+"."}scoreEl();setTimeout(()=>{busy=false;if(time<=0&&!reviewing){finish();return}next()},right?550:1400)}
function next(){if(reviewing){if(!missed.length){msg.textContent="You have practised every missed fact.";document.getElementById("choices").innerHTML="";document.getElementById("again-play").style.display="block";return}show(missed.shift());return}show(fact())}
function scoreEl(){document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak}
function tick(){time-=1;document.getElementById("time").textContent=time;if(time<=0){clearInterval(timer);if(!busy) finish()}}
function finish(){document.getElementById("play").style.display="none";document.getElementById("end").style.display="block";document.getElementById("again-play").style.display="none";document.getElementById("summary").textContent="You scored "+score+". Best streak: "+best+".";const list=document.getElementById("missed");list.innerHTML="";const unique=[];missed.forEach(item=>{if(!unique.some(u=>u.a===item.a&&u.b===item.b)) unique.push(item)});unique.forEach(item=>{const li=document.createElement("li");li.textContent=item.a+" × "+item.b+" = "+item.n;list.appendChild(li)});document.getElementById("review").style.display=unique.length?"block":"none";missed=unique}
function start(){time=60;score=0;streak=0;best=0;missed=[];busy=false;reviewing=false;document.getElementById("play").style.display="block";document.getElementById("end").style.display="none";document.getElementById("again-play").style.display="none";document.getElementById("time").textContent=time;scoreEl();clearInterval(timer);timer=setInterval(tick,1000);show(fact())}
document.getElementById("again").onclick=start;document.getElementById("again-play").onclick=start;
document.getElementById("review").onclick=()=>{reviewing=true;document.getElementById("play").style.display="block";document.getElementById("end").style.display="none";document.getElementById("again-play").style.display="none";next()};
start();
</script></body></html>
