<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How rain forms</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eef0;color:#1d2b36;font:15px/1.45 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:16px 18px 22px}h1{font-size:clamp(26px,4.6vw,40px);line-height:1.05;margin:0}main>p{max-width:640px;margin:8px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}section{background:#f7fafb;padding:14px;border-radius:14px}h2{font-size:17px;margin:0 0 10px}label,.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid #d5dee2}label{display:grid;gap:6px;align-items:stretch}label span{line-height:1.4}select,button{min-height:44px;border:1px solid #1d2b36;border-radius:8px;padding:8px 10px;font:inherit;background:#fff;color:#1d2b36}select{width:100%}button{background:#1d2b36;color:#f7fafb;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button.reset{background:transparent;color:#1d2b36}.step{border-bottom:1px solid #d5dee2;padding:8px 10px}.step p{flex:1;margin:0}.step button{min-width:44px;flex:0 0 auto}.msg{min-height:44px;margin:10px 0 0;font-weight:650;line-height:1.4}@media(max-width:700px){.grid{grid-template-columns:1fr}}.msg.ok{color:#2f6a45;font-weight:700}.msg.no{color:#a3372a;font-weight:700}.is-ok{box-shadow:inset 5px 0 0 #2f6a45}.is-bad{box-shadow:inset 5px 0 0 #a3372a;background:#f7e3dc!important}.is-ok .t::before{content:'✓ ';color:#2f6a45;font-weight:800}.is-bad .t::before{content:'✗ ';color:#a3372a;font-weight:800}
</style></head><body><main><h1>How does rain form? Build the paragraph.</h1><p>Name each sentence’s job, then put the explanation in a clear order.</p><div class="grid"><section><h2>Sentence jobs</h2><div id="jobs"></div><div class="actions"><button id="checkJ">Check jobs</button></div><p id="jm" class="msg" aria-live="polite"></p></section><section><h2>Paragraph order</h2><div id="order"></div><div class="actions"><button id="checkO">Check paragraph</button><button class="reset" id="reset">Reset</button></div><p id="om" class="msg" aria-live="polite"></p></section></div></main><script>
function say(el,ok,text){el.textContent=(ok?'✓ ':'✗ ')+text;el.classList.toggle('ok',ok);el.classList.toggle('no',!ok)}
function clearSay(el){el.textContent='';el.classList.remove('ok','no')}
function mark(el,ok){el.classList.toggle('is-ok',ok===true);el.classList.toggle('is-bad',ok===false)}
const s=['Rain is water that has changed form as it moves through the atmosphere.','Heat turns water from seas, rivers and wet ground into vapour that rises.','Cooler air turns vapour into tiny droplets that gather as clouds.','Rain can send that water back to the ground, and the same process can start again.'],a=['topic','support','support','conclusion'],opts='<option value="">Choose…</option><option value="topic">Topic sentence</option><option value="support">Supporting detail</option><option value="conclusion">Concluding link</option>',jobs=document.getElementById('jobs'),order=document.getElementById('order'),jm=document.getElementById('jm'),om=document.getElementById('om');jobs.innerHTML=s.map((x,i)=>`<label><span class="t">${x}</span><select data-a="${a[i]}">${opts}</select></label>`).join('');const jobHints={topic:'A topic sentence introduces the whole idea. Does this sentence do that, or describe just one part?',support:'A supporting detail explains one stage of the process. Is this one stage?',conclusion:'A concluding link wraps up and ties back to the start. Does this sentence do that?'};jobs.onchange=e=>{mark(e.target.parentElement,null);clearSay(jm)};document.getElementById('checkJ').onclick=()=>{const all=[...jobs.querySelectorAll('select')];if(all.some(x=>!x.value)){say(jm,false,'Choose a job for every sentence first.');return}all.forEach(x=>mark(x.parentElement,x.value===x.dataset.a));const wrong=all.filter(x=>x.value!==x.dataset.a);if(!wrong.length)say(jm,true,'Correct! One sentence names the idea, two add stages, and the last ties the cycle together.');else say(jm,false,`${all.length-wrong.length} of ${all.length} correct. Look again at the ones marked ✗. ${jobHints[wrong[0].value]}`)};let seq=[3,1,0,2];function render(checked){order.innerHTML=seq.map((n,i)=>`<div class="step${checked?(n===i?' is-ok':' is-bad'):''}"><p class="t">${s[n]}</p><button type="button" data-i="${i}" aria-label="Move up"${i?'':' disabled'}>Up</button></div>`).join('')}order.onclick=e=>{const i=+e.target.dataset.i;if(!i)return;[seq[i],seq[i-1]]=[seq[i-1],seq[i]];clearSay(om);render()};document.getElementById('checkO').onclick=()=>{const right=seq.filter((x,i)=>x===i).length;render(true);if(right===seq.length)say(om,true,'Correct! The paragraph now follows the water: the main idea, vapour, cloud droplets, then rain returning.');else say(om,false,`${right} of ${seq.length} sentences are in the right place. Start with the whole idea, then follow the water in the order it changes.`)};document.getElementById('reset').onclick=()=>{seq=[3,1,0,2];jobs.querySelectorAll('select').forEach(x=>{x.value='';mark(x.parentElement,null)});clearSay(jm);clearSay(om);render()};render();
</script></body></html>
