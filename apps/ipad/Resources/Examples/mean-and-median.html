<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mean and median</title><style>
*{box-sizing:border-box}body{margin:0;background-color:#f8f8f4;background-image:linear-gradient(#dfe5e7 1px,transparent 1px),linear-gradient(90deg,#dfe5e7 1px,transparent 1px);background-size:24px 24px;color:#182a35;font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px 20px 24px}header{border-bottom:2px solid #182a35;padding-bottom:13px}h1{font-size:clamp(29px,6vw,46px);line-height:1;margin:0}header p:last-child{max-width:580px;margin:10px 0 0;line-height:1.45}.plot-head{display:flex;justify-content:space-between;gap:10px;margin:18px 0 5px;font-size:14px}.plot-head span{color:#53656c;text-align:right}svg{display:block;width:100%;height:auto;background:#fbfbf7;border:2px solid #182a35;touch-action:none}svg text{font:13px system-ui,sans-serif;fill:#53656c}circle{cursor:grab;touch-action:none;stroke:#fbfbf7;stroke-width:3}circle:active{cursor:grabbing}.readout{display:flex;gap:28px;align-items:baseline;border-bottom:2px solid #182a35;padding:12px 0 15px}.readout span{font-weight:650}.readout strong{font-size:25px;margin-left:5px;color:#ba563d;font-variant-numeric:tabular-nums}.check{padding-top:15px}.check p{margin:0 0 10px}.answers{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.answers label{display:grid;gap:5px;font-weight:650}.answers select,button{min-height:44px;border:1px solid #182a35;background:#fbfbf7;color:#182a35;padding:8px 11px;font:inherit}button{background:#182a35;color:#fbfbf7;font-weight:700}#feedback{min-height:40px;line-height:1.4;margin:12px 0 0;color:#304b59}#reset{margin-top:8px;background:transparent;color:#182a35}@media(max-width:520px){main{padding:14px}.readout{gap:16px}.answers{display:grid}.answers label,.answers select,.answers button{width:100%}}
</style></head><body><main><header><h1>Mean and median</h1><p>Drag one score along the line. Try to move the mean away from the cluster while the median barely moves.</p></header><div class="plot-head"><strong>Seven scores</strong><span id="status">Drag a dot to a whole-number score.</span></div><svg id="plot" viewBox="0 0 680 280" role="img" aria-label="A dot plot of seven scores from one to eleven"><line x1="50" y1="210" x2="630" y2="210" stroke="#182a35" stroke-width="2"/><g id="ticks"></g><line id="meanLine" y1="35" y2="210" stroke="#ba563d" stroke-width="3" stroke-dasharray="7 6"/><line id="medianLine" y1="35" y2="210" stroke="#2d6f69" stroke-width="3"/><text id="meanLabel" y="25" text-anchor="middle" fill="#ba563d">mean</text><text id="medianLabel" y="25" text-anchor="middle" fill="#2d6f69">median</text><g id="dots"></g></svg><div class="readout"><span>Mean <strong id="mean">6.1</strong></span><span>Median <strong id="median">6</strong></span></div><section class="check"><p><strong>Check your change:</strong> which average was pulled, and why?</p><div class="answers"><label>Average<select id="which"><option value="">Choose…</option><option value="mean">Mean</option><option value="median">Median</option><option value="both">Both equally</option></select></label><label>Reason<select id="why"><option value="">Choose…</option><option value="all">It uses every score, so one extreme score changes the total.</option><option value="middle">It only uses the middle score.</option><option value="size">It is always the larger number.</option></select></label><button id="check">Check answer</button></div><p id="feedback" aria-live="polite"></p></section><button id="reset">Reset scores</button></main><script>
const plot=document.getElementById('plot'),dots=document.getElementById('dots'),ticks=document.getElementById('ticks'),meanLine=document.getElementById('meanLine'),medianLine=document.getElementById('medianLine'),meanLabel=document.getElementById('meanLabel'),medianLabel=document.getElementById('medianLabel'),statusText=document.getElementById('status'),scores=[5,6,6,6,6,7,7];let active=null;const start=[...scores],xFor=s=>50+(s-1)*58;function median(){const a=[...scores].sort((a,b)=>a-b);return a[3]}function draw(){const levels={};dots.querySelectorAll('circle').forEach((dot,i)=>{const s=scores[i],level=levels[s]||0;levels[s]=level+1;dot.setAttribute('cx',xFor(s));dot.setAttribute('cy',190-level*32)});const m=scores.reduce((a,b)=>a+b,0)/scores.length,med=median();meanLine.setAttribute('x1',xFor(m));meanLine.setAttribute('x2',xFor(m));medianLine.setAttribute('x1',xFor(med));medianLine.setAttribute('x2',xFor(med));meanLabel.setAttribute('x',xFor(m));medianLabel.setAttribute('x',xFor(med));document.getElementById('mean').textContent=m.toFixed(1);document.getElementById('median').textContent=med;statusText.textContent=Math.abs(m-med)>=.8&&med===6?'The mean has left the cluster; check your reason.':'Drag a dot to a whole-number score.'}for(let s=1;s<=11;s++){ticks.insertAdjacentHTML('beforeend',`<line x1="${xFor(s)}" y1="210" x2="${xFor(s)}" y2="218" stroke="#182a35"/><text x="${xFor(s)}" y="239" text-anchor="middle">${s}</text>`)}dots.innerHTML=scores.map((s,i)=>`<circle data-index="${i}" r="16" fill="${i===0?'#ba563d':'#2d6f69'}"/>`).join('');dots.addEventListener('pointerdown',e=>{if(e.target.tagName!=='circle')return;active=+e.target.dataset.index;e.target.setPointerCapture(e.pointerId)});dots.addEventListener('pointermove',e=>{if(active===null)return;const r=plot.getBoundingClientRect(),x=(e.clientX-r.left)*680/r.width;scores[active]=Math.max(1,Math.min(11,Math.round((x-50)/58+1)));draw()});dots.addEventListener('pointerup',()=>active=null);dots.addEventListener('pointercancel',()=>active=null);document.getElementById('check').onclick=()=>{const moved=Math.abs(scores.reduce((a,b)=>a+b,0)/7-median())>=.8&&median()===6,which=document.getElementById('which').value,why=document.getElementById('why').value;if(!moved){document.getElementById('feedback').textContent='First move one dot far enough that the mean is at least 0.8 away from the median, while the middle score stays 6.'}else if(which==='mean'&&why==='all'){document.getElementById('feedback').textContent='The mean was pulled because it uses every score. The median barely moved because the middle score is still 6.'}else{document.getElementById('feedback').textContent='Look at the markers: the mean uses every score, but the median is the middle score after the values are ordered.'}};document.getElementById('reset').onclick=()=>{start.forEach((v,i)=>scores[i]=v);document.getElementById('feedback').textContent='';document.getElementById('which').value='';document.getElementById('why').value='';draw()};draw();
</script></body></html>
