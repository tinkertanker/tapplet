<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What do m and c do?</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0ff;color:#22274d;font:15px system-ui,sans-serif}main{max-width:950px;margin:auto;padding:15px}h1{font-size:clamp(26px,4.5vw,38px);line-height:1.1;margin:0 0 8px}main>p{margin:0 0 14px;max-width:640px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}.card{background:#fff;padding:14px;border-radius:16px}h2{margin:0 0 8px;font-size:18px}h3{margin:16px 0 8px;font-size:15px}label{display:block;margin:12px 0;font-weight:700}input[type=range]{width:100%;min-height:44px;accent-color:#4c58c9}output{font-size:22px;font-variant-numeric:tabular-nums}svg{width:100%;height:330px;background:#fafaff}button{min-height:44px;border:0;border-radius:9px;padding:8px 12px;background:#4c58c9;color:#fff;font:inherit;font-weight:700}.answers button{display:block;width:100%;margin:6px 0;background:#eceeff;color:#22274d;text-align:left}.ok{outline:3px solid #32935f}.bad{outline:3px solid #c4474a}#hint,#msg{min-height:22px;line-height:1.4;margin:8px 0 0}@media(max-width:680px){.grid{grid-template-columns:1fr}svg{height:230px}}
</style></head><body><main><h1>What do m and c do?</h1><p>Predict whether the line gets steeper or moves, then change one number at a time.</p><div class="grid"><section class="card"><h2>y = <span id="eq"></span></h2><label>Gradient m: <output id="mv"></output><input id="m" type="range" min="-3" max="3" step=".5" value="1"></label><label>Vertical intercept c: <output id="cv"></output><input id="c" type="range" min="-5" max="5" value="0"></label><p>When x = 2, y = <strong id="y2"></strong></p><p id="hint">Change one number and watch the graph.</p><button type="button" id="reset">Reset</button><h3>When a line falls left to right…</h3><div class="answers"><button type="button" data-ok>the gradient is negative</button><button type="button" data-why="rise">the gradient is positive</button><button type="button" data-why="slide">the intercept is zero</button></div><p id="msg" aria-live="polite"></p></section><section class="card"><h2>Graph of y = mx + c</h2><svg viewBox="0 0 500 400" aria-label="Straight line graph"><path d="M25 200H475M250 20V380M25 65H475M25 335H475M100 20V380M400 20V380" stroke="#d9dcf4"/><path id="plot" stroke="#4c58c9" stroke-width="6" fill="none"/><circle id="intercept" r="7" fill="#e45d78"/><text x="455" y="220">x</text><text x="260" y="35">y</text></svg></section></div></main><script>
let prevM=1,prevC=0;
function draw(){const a=+m.value,b=+c.value;mv.value=a;cv.value=b;eq.textContent=`${a}x ${b<0?'−':'+'} ${Math.abs(b)}`;y2.textContent=(2*a+b).toFixed(1);plot.setAttribute('d',`M25 ${200-(a*-5+b)*9} L475 ${200-(a*5+b)*9}`);intercept.setAttribute('cx',250);intercept.setAttribute('cy',200-b*9);if(a!==prevM){hint.textContent=a===0?'m is 0, so the line is horizontal.':Math.abs(a)>Math.abs(prevM)?'m changed: the line is steeper.':Math.abs(a)<Math.abs(prevM)?'m changed: the line is less steep.':(a<0)!==(prevM<0)?'m changed: the line now goes the other way.':'m changed.';}else if(b!==prevC){hint.textContent=b>prevC?'c changed: the line moved up.':'c changed: the line moved down.';}prevM=a;prevC=b;}
m.oninput=c.oninput=draw;
reset.onclick=()=>{m.value=1;c.value=0;prevM=1;prevC=0;hint.textContent='Change one number and watch the graph.';msg.textContent='';document.querySelectorAll('.answers button').forEach(btn=>btn.classList.remove('ok','bad'));draw();};
document.querySelector('.answers').onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.answers button').forEach(btn=>btn.classList.remove('ok','bad'));const ok=e.target.dataset.ok!==undefined;e.target.classList.add(ok?'ok':'bad');msg.textContent=ok?'The line falls when m is negative, because y decreases as x increases.':e.target.dataset.why==='rise'?'A positive gradient rises from left to right. Set m below 0 and watch the line fall.':'c only slides the line up or down. The fall is controlled by the gradient m.';};
draw();
</script></body></html>
