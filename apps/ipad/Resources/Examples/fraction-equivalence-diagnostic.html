<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equivalent fractions</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2ef;color:#1c2622;font:15px system-ui,sans-serif}main{max-width:780px;margin:auto;padding:16px 18px 22px}header{border-bottom:2px solid #1c2622;padding-bottom:12px}h1{font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0}header p{margin:8px 0 0;max-width:620px}.bars{display:grid;gap:12px;padding:14px 0 10px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.bar{display:flex;height:48px;border:2px solid #1c2622;background:#fff}.bar i{flex:1;border-right:1px solid #1c2622}.bar i:last-child{border-right:0}.bar .fill{background:#2a7a68}.frac{font-size:28px;font-weight:750;min-width:3.6ch;text-align:right;font-variant-numeric:tabular-nums}.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.ctrl span{font-weight:700;min-width:4.2em}#match{margin:0 0 12px;min-height:22px;font-weight:650}.checks{border-top:2px solid #1c2622;padding-top:12px}fieldset{border:0;margin:0 0 12px;padding:0}legend{font-weight:750;padding:0}fieldset p{margin:6px 0 0;min-height:36px;line-height:1.35}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}button{min-height:44px;min-width:44px;border:1px solid #1c2622;border-radius:8px;padding:8px 12px;font:inherit;font-weight:700;background:#fff;color:#1c2622}.ok{background:#c6e4d6;outline:3px solid #2a7a68}.bad{background:#f3d0c8;outline:3px solid #a94438}#reset{margin-top:4px;background:#1c2622;color:#eef2ef}@media(max-width:560px){.row{grid-template-columns:1fr}.frac{text-align:left}}
</style></head><body><main><header><h1>Equivalent fractions</h1><p>Split and shade the two bars. Equivalent fractions cover the same amount.</p></header><div class="bars"><div class="row"><div id="barA" class="bar" role="img" aria-label=""></div><span class="frac" id="fracA"></span></div><div class="ctrl" data-bar="a"><span>Parts</span><button type="button" data-act="p" data-d="-1" aria-label="Fewer parts on the first bar">−</button><button type="button" data-act="p" data-d="1" aria-label="More parts on the first bar">+</button><span>Shaded</span><button type="button" data-act="s" data-d="-1" aria-label="Shade fewer on the first bar">−</button><button type="button" data-act="s" data-d="1" aria-label="Shade more on the first bar">+</button></div><div class="row"><div id="barB" class="bar" role="img" aria-label=""></div><span class="frac" id="fracB"></span></div><div class="ctrl" data-bar="b"><span>Parts</span><button type="button" data-act="p" data-d="-1" aria-label="Fewer parts on the second bar">−</button><button type="button" data-act="p" data-d="1" aria-label="More parts on the second bar">+</button><span>Shaded</span><button type="button" data-act="s" data-d="-1" aria-label="Shade fewer on the second bar">−</button><button type="button" data-act="s" data-d="1" aria-label="Shade more on the second bar">+</button></div></div><p id="match"></p><section class="checks"><fieldset><legend>Which fraction is equivalent to 3/6?</legend><div class="choices" id="q1"><button type="button" data-p="2" data-s="1">1/2</button><button type="button" data-p="12" data-s="3">3/12</button><button type="button" data-p="9" data-s="6">6/9</button><button type="button" data-p="6" data-s="2">2/6</button></div><p id="f1" aria-live="polite"></p></fieldset><fieldset><legend>Why is 2/5 equivalent to 6/15?</legend><div class="choices" id="q2"><button type="button" data-why="add410">Add 4 and 10</button><button type="button" data-why="mul3">Multiply both parts by 3</button><button type="button" data-why="mulTop">Multiply the top only</button><button type="button" data-why="add3">Add 3 to both</button></div><p id="f2" aria-live="polite"></p></fieldset><fieldset><legend>4/6 is equivalent to 2/3 because both parts were divided by</legend><div class="choices" id="q3"><button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button><button type="button" data-d="4">4</button></div><p id="f3" aria-live="polite"></p></fieldset><button type="button" id="reset">Reset</button></section></main><script>
const state={a:{p:6,s:3},b:{p:5,s:2}};
function paint(el,p,s,name){el.innerHTML=Array.from({length:p},(_,i)=>`<i class="${i<s?'fill':''}"></i>`).join('');el.setAttribute('aria-label',`${s} of ${p} equal parts shaded on the ${name} bar`);}
function draw(){paint(barA,state.a.p,state.a.s,'first');paint(barB,state.b.p,state.b.s,'second');fracA.textContent=state.a.s+'/'+state.a.p;fracB.textContent=state.b.s+'/'+state.b.p;match.textContent=state.a.s*state.b.p===state.b.s*state.a.p?'These fractions are equivalent: the shaded amounts match.':'These fractions are not equivalent: the shaded amounts differ.';}
function show(a,b){state.a={p:a[0],s:a[1]};state.b={p:b[0],s:b[1]};draw();}
function mark(group,btn,ok){group.querySelectorAll('button').forEach(x=>x.classList.remove('ok','bad'));btn.classList.add(ok?'ok':'bad');}
document.querySelectorAll('.ctrl').forEach(row=>row.onclick=e=>{const btn=e.target.closest('button');if(!btn)return;const bar=state[row.dataset.bar],d=+btn.dataset.d;if(btn.dataset.act==='p'){bar.p=Math.max(2,Math.min(16,bar.p+d));bar.s=Math.min(bar.s,bar.p);}else bar.s=Math.max(0,Math.min(bar.p,bar.s+d));draw();});
q1.onclick=e=>{if(e.target.tagName!=='BUTTON')return;const p=+e.target.dataset.p,s=+e.target.dataset.s;show([6,3],[p,s]);mark(q1,e.target,p===2&&s===1);f1.textContent=p===2&&s===1?'3/6 and 1/2 shade the same amount: both are half of the bar.':p===12?'3/12 keeps 3 on top but cuts the whole into twice as many parts, so each part is smaller. The shaded length is shorter than 3/6.':p===9?'6/9 is two-thirds, not a half. Adding 3 to both 3 and 6 does not keep the same amount.':'2/6 shades two of six equal parts, which is one-third, not a half.';};
q2.onclick=e=>{if(e.target.tagName!=='BUTTON')return;const why=e.target.dataset.why;show([5,2],[15,6]);mark(q2,e.target,why==='mul3');f2.textContent={mul3:'Both 2 and 5 were multiplied by 3, so 2/5 and 6/15 name the same amount.',add410:'Adding 4 to the top and 10 to the bottom happens to reach 6/15, but only because 4/10 is also equivalent to 2/5. Multiply both parts by the same number.',mulTop:'Multiplying only the top gives 6/5, which is more than one whole. Both parts have to change together to keep 6/15.',add3:'Adding 3 to both parts gives 5/8, not 6/15. Multiply or divide both parts by the same number.'}[why];};
q3.onclick=e=>{if(e.target.tagName!=='BUTTON')return;const d=e.target.dataset.d;show([6,4],[3,2]);mark(q3,e.target,d==='2');f3.textContent={1:'Dividing by 1 leaves 4/6 unchanged. You need the number that turns 4 into 2 and 6 into 3.',2:'Both 4 and 6 were divided by 2, so 4/6 simplifies to 2/3 without changing its value.',3:'Dividing by 3 would give 4÷3 and 2, not 2/3. Look at 4 → 2 and 6 → 3.',4:'Dividing both by 4 gives 1 and 1.5, not 2/3.'}[d];};
reset.onclick=()=>{show([6,3],[5,2]);[q1,q2,q3].forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.remove('ok','bad')));f1.textContent=f2.textContent=f3.textContent='';};
draw();
</script></body></html>
