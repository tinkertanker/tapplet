<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cut extra words</title><style>
*{box-sizing:border-box}body{margin:0;background:#fbfaf6;color:#242b2d;font:17px/1.5 Georgia,serif}main{max-width:820px;margin:auto;padding:20px 22px 26px}header{border-bottom:1px solid #242b2d;padding-bottom:14px}h1{font:700 clamp(30px,6vw,52px)/1.02 system-ui,sans-serif;margin:0}header p:last-child{margin:12px 0 0;max-width:650px}#editor{margin:22px 0 13px;font-size:clamp(20px,3vw,28px);line-height:1.75}button{font:inherit;min-height:44px}.token{border:0;border-bottom:2px dotted #aab1af;background:transparent;color:inherit;padding:5px 2px;margin:0 1px;cursor:pointer}.token:hover{background:#f0e5d6}.token.cut{color:#9a4437;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#9a4437;background:#f3e1d9;border-bottom-color:transparent}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;border-top:2px solid #242b2d;border-bottom:1px solid #bfc2bc;padding:12px 0}.count{font:700 15px system-ui,sans-serif}.count strong{font-size:24px;color:#a64f36}button.action{background:#242b2d;color:#fbfaf6;border:0;padding:9px 15px;font:700 15px system-ui,sans-serif}button.reset{background:transparent;color:#242b2d;border:1px solid #242b2d}.actions{display:flex;gap:8px;flex-wrap:wrap}#feedback{min-height:47px;margin:14px 0 0;font-family:system-ui,sans-serif;font-size:15px;line-height:1.4}@media(max-width:520px){main{padding:15px}.toolbar{align-items:flex-start;display:block}.actions{margin-top:10px}}
</style></head><body><main><header><h1>Cut extra words</h1><p>Tap words or short phrases to strike them out. Keep the rule clear and keep the useful facts.</p></header><div id="editor" aria-label="Paragraph to edit"></div><div class="toolbar"><div class="count"><strong id="count">0</strong> words left</div><div class="actions"><button class="action" id="check">Check paragraph</button><button class="action reset" id="reset">Reset</button></div></div><p id="feedback" aria-live="polite"></p></main><script>
const phrases=[['At our school canteen,',true],['students must',true],['return their trays',true],['to the collection point',true],['after eating.',true],['This rule is in place because',true],['it keeps tables clear',true],['very important and useful',false],['for the next group of students',false],['and reduces',true],['the amount of',false],['work',true],['that',false],['the canteen cleaners',true],['need to do',true],['during the',true],['busy',false],['lunch period.',true]];const editor=document.getElementById('editor');editor.innerHTML=phrases.map(([text,keep],i)=>`<button class="token" data-index="${i}" data-words="${text.trim().split(/\s+/).length}" data-keep="${keep}">${text}</button>`).join(' ');function count(){return [...editor.children].filter(x=>!x.classList.contains('cut')).reduce((n,x)=>n+ +x.dataset.words,0)}function update(){document.getElementById('count').textContent=count()}editor.addEventListener('click',e=>{if(!e.target.classList.contains('token'))return;e.target.classList.toggle('cut');update();document.getElementById('feedback').textContent=''});document.getElementById('check').onclick=()=>{const tokens=[...editor.children],bad=tokens.some(x=>x.classList.contains('cut')&&x.dataset.keep==='true'),left=tokens.filter(x=>!x.classList.contains('cut')&&x.dataset.keep==='false'),cutCount=tokens.filter(x=>x.classList.contains('cut')).length;if(bad)document.getElementById('feedback').textContent='A key fact was cut. The final paragraph must still say who acts, what they return, where they put it and when they do it.';else if(!cutCount)document.getElementById('feedback').textContent='Nothing has been cut yet. Tap the extra words first, then check again.';else if(left.length)document.getElementById('feedback').textContent='The rule is still clear, but '+left.length+(left.length===1?' phrase is':' phrases are')+' still waffle. Look for padding that does not change the rule or the reason.';else document.getElementById('feedback').textContent='The shorter version keeps the rule and its reason: returning trays keeps tables clear and reduces cleaners’ work.'};document.getElementById('reset').onclick=()=>{editor.querySelectorAll('.cut').forEach(x=>x.classList.remove('cut'));document.getElementById('feedback').textContent='';update()};update();
</script></body></html>
