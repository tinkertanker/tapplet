name: Tapplet

options:
  bundleIdPrefix: sg.tinkertanker
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    DEVELOPMENT_TEAM: PQ6U5ESLN2

targets:
  Tapplet:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Examples
        type: folder
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tapplet Studio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Take a photo of a classroom diagram, worksheet or sketch to include in a tapplet.
        NSPhotoLibraryUsageDescription: Choose classroom images to include in a tapplet.
        TappletAPIBaseURL: "$(TAPPLET_API_BASE_URL)"
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.tinkertanker.Tapplet
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          TAPPLET_API_BASE_URL: http://127.0.0.1:8787
        Release:
          TAPPLET_API_BASE_URL: https://classroom-widgets-studio-api.tinkertanker.workers.dev
    scheme:
      testTargets:
        - TappletTests
        - TappletUITests
      gatherCoverageData: true

  TappletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Tapplet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.tinkertanker.TappletTests
        GENERATE_INFOPLIST_FILE: true

  TappletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Tapplet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.tinkertanker.TappletUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Tapplet
