name: Verify

on:
  push:
    branches:
      - master
  pull_request:
    # labeled lets the ui-tests label start the UI suite on a PR.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly UI suite, 02:23 Singapore time.
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fingerprint installed dependencies
        id: dependencies
        shell: bash
        run: |
          # First-party hooks/local dependencies may produce files outside
          # node_modules. Always reinstall those rather than caching half a build.
          fingerprint=$(
            {
              . /etc/os-release
              printf '%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ID" "$VERSION_ID"
              node --version
              npm --version
              npm config list --json
              printf '%s\n' 'npm ci'
              git ls-files -z | node -e '
                const fs = require("node:fs");
                const files = fs.readFileSync(0, "utf8").split("\0").filter(Boolean);
                const requiresInstall = files.some(f => /(^|\/)binding\.gyp$/.test(f)) || files.filter(f => /(^|\/)package\.json$/.test(f)).some(f => {
                  const p = JSON.parse(fs.readFileSync(f, "utf8"));
                  const hooks = ["preinstall", "install", "postinstall", "prepublish", "preprepare", "prepare", "postprepare"];
                  const deps = [p.dependencies, p.devDependencies, p.optionalDependencies, p.peerDependencies].flatMap(d => Object.values(d || {}));
                  // Cover npm-package-arg local forms (including slashless paths),
                  // local Git and bare tarballs; extra path-like bypasses are safe.
                  return hooks.some(h => p.scripts?.[h]) || deps.some(d => /^(\.|[a-z]:|file:|link:|workspace:|git\+file:)|[\/\\]|\.(tgz|tar|tar\.gz)$/i.test(d));
                });
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `cacheable=${!requiresInstall}\n`);
                const inputs = files.filter(f =>
                  /(^|\/)(package(-lock)?\.json|npm-shrinkwrap\.json|\.npmrc)$/.test(f) || f === ".github/workflows/ci.yml");
                process.stdout.write(inputs.join("\0") + "\0");
              ' | xargs -0 sha256sum --
            } | sha256sum | cut -d ' ' -f1
          )
          echo "key=node-installed-v1-$RUNNER_OS-$RUNNER_ARCH-$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore installed dependencies
        id: installed
        if: steps.dependencies.outputs.cacheable == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: ${{ steps.dependencies.outputs.key }}
          path: |
            node_modules
            services/api/node_modules
      - run: npm ci
        if: steps.installed.outputs.cache-hit != 'true'
      # Save the pristine install now, never after verification/build mutations.
      - name: Save installed dependencies
        if: steps.dependencies.outputs.cacheable == 'true' && steps.installed.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: ${{ steps.dependencies.outputs.key }}
          path: |
            node_modules
            services/api/node_modules
      - run: npx playwright install --with-deps --only-shell chromium webkit
      - run: npm run verify
      - run: npm run api:build

  # Native jobs run only when the iPad app or this workflow changes, and on
  # nightly or manual runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ipad: ${{ steps.diff.outputs.ipad }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if { [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; } \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "ipad=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(apps/ipad/|\.github/(workflows/ci\.yml|actions/ipad-setup/))'; then
            echo "ipad=true" >> "$GITHUB_OUTPUT"
          else
            echo "ipad=false" >> "$GITHUB_OUTPUT"
          fi

  ipad:
    needs: changes
    if: needs.changes.outputs.ipad == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ipad-setup
      - name: Build Tapplet unsigned (Release)
        run: xcodebuild -project apps/ipad/Tapplet.xcodeproj -scheme Tapplet -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests (Debug)
        run: xcodebuild -project apps/ipad/Tapplet.xcodeproj -scheme Tapplet -configuration Debug -destination "platform=iOS Simulator,id=$TAPPLET_TEST_DEVICE" -resultBundlePath "$RUNNER_TEMP/tapplet-test-evidence/TappletTests.xcresult" CODE_SIGNING_ALLOWED=NO TAPPLET_API_BASE_URL=http://127.0.0.1:8787 -only-testing:TappletTests test
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tapplet-unit-tests
          path: ${{ runner.temp }}/tapplet-test-evidence
          retention-days: 7
          if-no-files-found: warn

  # UI tests are slow (~15 min), so PRs run them only with the ui-tests label.
  ipad-ui:
    needs: changes
    if: >-
      needs.changes.outputs.ipad == 'true' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'ui-tests'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ipad-setup
      - name: Run UI tests (Debug)
        run: |
          xcrun simctl list devices -j > "$RUNNER_TEMP/tapplet-test-evidence/devices-before.json"
          vm_stat > "$RUNNER_TEMP/tapplet-test-evidence/memory-before.txt"
          date -u > "$RUNNER_TEMP/tapplet-test-evidence/test-start.txt"
          xcodebuild -project apps/ipad/Tapplet.xcodeproj -scheme Tapplet -configuration Debug -destination "platform=iOS Simulator,id=$TAPPLET_TEST_DEVICE" -resultBundlePath "$RUNNER_TEMP/tapplet-test-evidence/TappletUITests.xcresult" CODE_SIGNING_ALLOWED=NO TAPPLET_API_BASE_URL=http://127.0.0.1:8787 -only-testing:TappletUITests test
      - name: Capture simulator launch diagnostics on failure
        if: failure() && env.TAPPLET_TEST_DEVICE != ''
        timeout-minutes: 2
        run: |
          date -u > "$RUNNER_TEMP/tapplet-test-evidence/failure-time.txt"
          xcrun simctl list devices -j > "$RUNNER_TEMP/tapplet-test-evidence/devices-after.json"
          vm_stat > "$RUNNER_TEMP/tapplet-test-evidence/memory-after.txt"
          xcrun simctl spawn "$TAPPLET_TEST_DEVICE" log show --last 1h --style compact --predicate 'process == "runningboardd" OR process == "SpringBoard" OR process == "backboardd" OR subsystem BEGINSWITH "com.apple.FrontBoard"' > "$RUNNER_TEMP/tapplet-test-evidence/simulator-launch.log" 2>&1
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tapplet-native-tests
          path: ${{ runner.temp }}/tapplet-test-evidence
          retention-days: 7
          if-no-files-found: warn

  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # The Worker does not depend on the native app; iPad jobs gate their own merges.
    needs:
      - node
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Keep the Cloudflare token off this step: npm lifecycle scripts run here.
      - run: npm ci
      - name: Apply production D1 migrations
        working-directory: services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy production Worker
        working-directory: services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Verify production health
        run: curl --fail --retry 5 --retry-delay 2 --retry-all-errors https://classroom-widgets-studio-api.tinkertanker.workers.dev/health
