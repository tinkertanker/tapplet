name: Verify

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run api:build

  ipad:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen 2.44.1
        run: |
          curl -fsSLo /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo /tmp/xcodegen/xcodegen/install.sh
          test "$(xcodegen --version)" = "XcodeGen version: 2.44.1"
      - run: xcodegen generate --spec apps/ipad/project.yml --project apps/ipad
      - name: Build Tapplet unsigned
        run: xcodebuild -project apps/ipad/Tapplet.xcodeproj -scheme Tapplet -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run TappletTests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if "iPad" in x["name"]))')
          xcodebuild -project apps/ipad/Tapplet.xcodeproj -scheme Tapplet -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO -only-testing:TappletTests test
